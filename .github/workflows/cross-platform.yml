name: Linux-first cross-platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (primary)
            allow_failure: false
          - os: windows-latest
            label: Windows (compatibility)
            allow_failure: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CPython 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-build.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff format (advisory)
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Ruff lint (advisory)
        continue-on-error: true
        run: python -m ruff check .

      - name: Mypy strict (advisory)
        continue-on-error: true
        run: python -m mypy src/xqatexp

      - name: Offline test suite
        run: python -m pytest -m "not live_tushare" --cov=xqatexp --cov-report=term-missing --cov-fail-under=80

      - name: CLI help
        run: python -m xqatexp --help

      - name: Offline self-check
        run: python -m xqatexp self-check --offline
