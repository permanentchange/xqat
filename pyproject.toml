[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xqatexp"
version = "0.1.0"
description = "Local A-share quantitative strategy research and decision tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "XQatExp Contributors" }]
dependencies = [
  "duckdb>=1.2,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2,<3",
  "pyarrow>=18,<24",
]

[project.scripts]
xqatexp = "xqatexp.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["xqatexp*", "schemas*"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live_tushare: performs explicitly authorized live Tushare requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xqatexp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
